{% extends "base.html" %}

{% block title %}{{ page_title }} - CyberCloak{% endblock %}

{% block content %}
<div class="placeholder-container">
    <div class="container">
        <div class="row">
            <div class="col-lg-8 mx-auto text-center">
                <div class="placeholder-content floating-card">
                    <div class="placeholder-icon">
                        <i class="fas fa-{{ page_icon }} fa-4x"></i>
                    </div>
                    <h1 class="placeholder-title">{{ page_title }}</h1>
                    <p class="placeholder-description">{{ page_description }}</p>
                    
                    <div class="placeholder-actions">
                        <a href="{{ url_for('index') }}" class="btn btn-primary me-3">
                            <i class="fas fa-home me-2"></i>Go Home
                        </a>
                        <a href="{{ url_for('contact') }}" class="btn btn-outline-primary">
                            <i class="fas fa-envelope me-2"></i>Contact Us
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
document.addEventListener('DOMContentLoaded', function() {
    // Add entrance animation
    const content = document.querySelector('.placeholder-content');
    content.style.opacity = '0';
    content.style.transform = 'translateY(30px)';
    
    setTimeout(() => {
        content.style.transition = 'all 0.6s ease';
        content.style.opacity = '1';
        content.style.transform = 'translateY(0)';
    }, 100);
});
</script>
{% endblock %}
