{% extends "base.html" %}

{% block title %}Reset Password - CyberCloak{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="container">
        <div class="row justify-content-center align-items-center min-vh-100">
            <div class="col-md-6 col-lg-5">
                <div class="auth-card floating-card">
                    <div class="text-center mb-4">
                        <div class="auth-logo mb-3">
                            <span class="gradient-text">🔐</span>
                        </div>
                        <h2 class="auth-title">Reset Password</h2>
                        <p class="auth-subtitle">Enter your new password below</p>
                    </div>

                    <form id="resetPasswordForm">
                        <input type="hidden" id="token" value="{{ token }}">
                        
                        <div class="mb-3">
                            <label for="password" class="form-label">New Password</label>
                            <input type="password" class="form-control" id="password" name="password" 
                                   placeholder="Enter new password" required minlength="6">
                            <div class="form-text">Password must be at least 6 characters long</div>
                        </div>
                        
                        <div class="mb-3">
                            <label for="confirm_password" class="form-label">Confirm Password</label>
                            <input type="password" class="form-control" id="confirm_password" name="confirm_password" 
                                   placeholder="Confirm new password" required minlength="6">
                        </div>
                        
                        <button type="submit" class="btn btn-primary btn-lg glow-btn w-100 mb-3">
                            <i class="fas fa-key me-2"></i>Reset Password
                        </button>
                    </form>

                    <div class="text-center">
                        <a href="{{ url_for('login') }}" class="back-link">
                            <i class="fas fa-arrow-left me-2"></i>Back to Login
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
document.addEventListener('DOMContentLoaded', function() {
    const form = document.getElementById('resetPasswordForm');
    const passwordField = document.getElementById('password');
    const confirmPasswordField = document.getElementById('confirm_password');
    
    // Real-time password validation
    function validatePasswords() {
        const password = passwordField.value;
        const confirmPassword = confirmPasswordField.value;
        
        if (password && confirmPassword) {
            if (password === confirmPassword) {
                confirmPasswordField.classList.remove('is-invalid');
                confirmPasswordField.classList.add('is-valid');
            } else {
                confirmPasswordField.classList.remove('is-valid');
                confirmPasswordField.classList.add('is-invalid');
            }
        }
    }
    
    passwordField.addEventListener('input', validatePasswords);
    confirmPasswordField.addEventListener('input', validatePasswords);
    
    form.addEventListener('submit', async function(e) {
        e.preventDefault();
        
        const password = passwordField.value;
        const confirmPassword = confirmPasswordField.value;
        
        // Client-side validation
        if (password !== confirmPassword) {
            const errorDiv = document.createElement('div');
            errorDiv.className = 'alert alert-danger mt-3';
            errorDiv.innerHTML = `
                <i class="fas fa-exclamation-triangle me-2"></i>
                Passwords do not match
            `;
            form.appendChild(errorDiv);
            setTimeout(() => errorDiv.remove(), 5000);
            return;
        }
        
        if (password.length < 6) {
            const errorDiv = document.createElement('div');
            errorDiv.className = 'alert alert-danger mt-3';
            errorDiv.innerHTML = `
                <i class="fas fa-exclamation-triangle me-2"></i>
                Password must be at least 6 characters long
            `;
            form.appendChild(errorDiv);
            setTimeout(() => errorDiv.remove(), 5000);
            return;
        }
        
        const submitBtn = form.querySelector('button[type="submit"]');
        const originalText = submitBtn.innerHTML;
        
        // Show loading state
        submitBtn.innerHTML = '<div class="spinner-border spinner-border-sm me-2"></div>Resetting...';
        submitBtn.disabled = true;
        
        try {
            const formData = new FormData(form);
            const token = document.getElementById('token').value;
            const response = await fetch(`/reset-password/${token}`, {
                method: 'POST',
                body: formData
            });
            
            const result = await response.json();
            
            if (result.success) {
                // Show success message
                const successDiv = document.createElement('div');
                successDiv.className = 'alert alert-success mt-3';
                successDiv.innerHTML = `
                    <i class="fas fa-check-circle me-2"></i>
                    ${result.message}
                `;
                form.appendChild(successDiv);
                
                // Redirect to login after success
                setTimeout(() => {
                    window.location.href = result.redirect || '/login';
                }, 2000);
            } else {
                // Show error message
                const errorDiv = document.createElement('div');
                errorDiv.className = 'alert alert-danger mt-3';
                errorDiv.innerHTML = `
                    <i class="fas fa-exclamation-triangle me-2"></i>
                    ${result.error}
                `;
                form.appendChild(errorDiv);
                
                // Remove error message after 5 seconds
                setTimeout(() => {
                    errorDiv.remove();
                }, 5000);
            }
        } catch (error) {
            console.error('Error:', error);
            const errorDiv = document.createElement('div');
            errorDiv.className = 'alert alert-danger mt-3';
            errorDiv.innerHTML = `
                <i class="fas fa-exclamation-triangle me-2"></i>
                Failed to reset password. Please try again.
            `;
            form.appendChild(errorDiv);
        } finally {
            // Restore button
            submitBtn.innerHTML = originalText;
            submitBtn.disabled = false;
        }
    });
});
</script>
{% endblock %}
